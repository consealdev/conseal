name: Publish to npm
run-name: "${{ contains(github.ref_name, '-') && format('Release candidate {0}', github.ref_name) || format('Publish {0} to npm', github.ref_name) }}"

# Two kinds of tag run through this workflow:
#
#   vX.Y.Z-rc.N   Release candidate. Runs the unit and browser tests, builds the
#                 package and attaches it to a GitHub pre-release. Nothing goes
#                 to npm.
#
#   vX.Y.Z        The release. Refuses to run unless a vX.Y.Z-rc.N tag points at
#                 the same commit, then stages the version on npm, where it goes
#                 live once approved.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Release candidates only; job rc needs it, so it is skipped with it. A run started
  # by hand from a branch whose name has a dash isn't one: only a tag is.
  test:
    name: Tests
    if: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') }}
    uses: ./.github/workflows/ci.yml

  rc:
    name: Publish release candidate
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the pre-release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # The same build as the release's below, versioned as the candidate.
      - run: npm ci
      - run: npm run build
      - run: npm version ${TAG#v} --no-git-tag-version
      - run: sed -i "s/__VERSION__/${TAG#v}/g" dist/index.min.js

      # The tarball npm would publish. A pre-release is never GitHub's latest,
      # and pages.yml leaves the docs alone for it.
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TGZ=$(npm pack --json | jq -r '.[0].filename')
          gh release create "$TAG" "$TGZ" \
            --prerelease \
            --title "$TAG" \
            --notes "Release candidate for ${TAG%-rc.*}. Nothing from it is published to npm."

  publish:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: release  # v* tags only; npm trusts only this environment
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # A release must have had a release candidate on the same commit, so the run
      # that stages it is never the commit's first. Checked first, before the build.
      # It proves an RC was cut, not that its run passed: check that before releasing.
      - name: Require a release candidate
        env:
          TAG: ${{ github.ref_name }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          # Glob refspec: fetches every vX.Y.Z-rc.N tag; matching none is not an error.
          git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}-rc.*:refs/tags/${TAG}-rc.*" || true
          FOUND=""
          for t in $(git tag -l "${TAG}-rc.*"); do
            if [ "$(git rev-parse "$t^{commit}")" = "$HEAD_SHA" ]; then FOUND="$t"; fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::No release candidate for $TAG on this commit ($HEAD_SHA). Delete this tag, push a ${TAG}-rc.N tag on this commit and check its run, then release $TAG."
            exit 1
          fi
          echo "Release candidate $FOUND is on this commit."

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build
      - run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version
      - run: sed -i "s/__VERSION__/${GITHUB_REF_NAME#v}/g" dist/index.min.js
      - run: npm stage publish --access public --provenance
