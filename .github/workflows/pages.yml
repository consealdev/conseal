name: Publish to GitHub Pages
run-name: "Publish ${{ github.ref_name }} to GitHub Pages"

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A release candidate's pre-release leaves the docs as they are.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - name: Inject version into docs
        run: sed -i 's/__VERSION__/${{ github.ref_name }}/g' docs/*.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

      - id: deployment
        uses: actions/deploy-pages@v5
