name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec:
    name: Spec lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Lint the OpenAPI files
        working-directory: spec
        run: npx --yes @redocly/cli@2.54.3 lint openapi.yaml circle.yaml
